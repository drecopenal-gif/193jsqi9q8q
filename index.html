<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XRYS Script Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Courier New', Courier, monospace; }
        .glass { background: rgba(30, 41, 59, 0.8); border: 1px solid #334155; }
    </style>
</head>
<body class="h-screen flex flex-col p-4">
    <div class="glass max-w-2xl w-full mx-auto rounded-xl p-6 shadow-2xl mt-10 flex-1">
        <div class="flex justify-between items-center border-b border-gray-700 pb-4 mb-4">
            <h1 class="text-2xl font-bold text-green-400"><i class="fas fa-code mr-2"></i>XRYS Scripts</h1>
            <a href="https://console.firebase.google.com/" target="_blank" class="text-sm bg-gray-700 px-3 py-1 rounded hover:bg-gray-600 transition">
                <i class="fas fa-database"></i> Firebase DB
            </a>
        </div>
        
        <p class="text-sm text-gray-400 mb-4">Active Scripts (Copy and send on Telegram):</p>
        
        <div id="loader" class="text-green-400 text-center mt-10">
            <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
            <p>Fetching from Database...</p>
        </div>

        <ul id="scriptList" class="space-y-2 overflow-y-auto max-h-[60vh] pr-2 hidden">
            <!-- Scripts load here -->
        </ul>
    </div>

    <script>
        const FIREBASE_URL = "https://download-apks-adc2c-default-rtdb.firebaseio.com/scripts.json";

        async function fetchScripts() {
            try {
                const res = await fetch(FIREBASE_URL);
                const data = await res.json();
                
                document.getElementById('loader').classList.add('hidden');
                const list = document.getElementById('scriptList');
                list.classList.remove('hidden');

                if(!data) {
                    list.innerHTML = "<p class='text-gray-500'>No scripts found in Firebase.</p>";
                    return;
                }

                for(let key in data) {
                    let li = document.createElement('li');
                    li.className = "glass p-3 rounded flex justify-between items-center text-sm";
                    li.innerHTML = `
                        <span class="text-green-300 font-bold">${key}</span>
                        <button onclick="copyToClipboard('${key}')" class="text-gray-400 hover:text-white"><i class="fas fa-copy"></i> Copy</button>
                    `;
                    list.appendChild(li);
                }
            } catch(e) {
                document.getElementById('loader').innerHTML = "<p class='text-red-500'>Error fetching. Check Firebase URL.</p>";
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
            alert("Script Copied: " + text);
        }

        fetchScripts();
    </script>
</body>
</html>
