<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Panel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{background:linear-gradient(135deg,#0a0014,#140028 50%,#0a0014);color:#fff;min-height:100vh;padding:20px}
.glass{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);backdrop-filter:blur(20px);border-radius:20px;padding:24px;box-shadow:0 8px 32px rgba(0,0,0,0.4)}
.container{max-width:720px;margin:0 auto}
h1{font-size:28px;background:linear-gradient(135deg,#a78bfa,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:24px;text-align:center}
h2{font-size:18px;margin-bottom:12px;color:#a78bfa}
label{display:block;font-size:13px;color:#94a3b8;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
textarea,input{width:100%;padding:14px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);border-radius:12px;color:#fff;font-family:'Courier New',monospace;font-size:14px;resize:vertical}
textarea:focus,input:focus{outline:none;border-color:#a78bfa;box-shadow:0 0 0 3px rgba(167,139,250,0.15)}
textarea{min-height:120px}
button{padding:14px 24px;background:linear-gradient(135deg,#7c3aed,#22d3ee);border:none;border-radius:12px;color:#fff;font-weight:600;font-size:15px;cursor:pointer;transition:all 0.2s;width:100%;margin-top:8px}
button:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(124,58,237,0.4)}
button:active{transform:scale(0.98)}
.section{margin-bottom:24px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:linear-gradient(135deg,#10b981,#22d3ee);padding:14px 28px;border-radius:12px;font-weight:600;transition:transform 0.3s;z-index:999}
.toast.show{transform:translateX(-50%) translateY(0)}
#loginScreen{max-width:400px;margin:100px auto}
.hidden{display:none!important}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="loginScreen" class="glass">
  <h1>Admin Access</h1>
  <label>Password</label>
  <input type="password" id="passInput" placeholder="Enter password">
  <button onclick="login()">Unlock</button>
</div>

<div id="panel" class="container hidden">
  <h1>Script Control Panel</h1>

  <div class="section glass">
    <h2>Login Bypass Script</h2>
    <label>Paste script here</label>
    <textarea id="loginScript" placeholder="login bypass script..."></textarea>
  </div>

  <div class="section glass">
    <h2>In Match Bypass Script</h2>
    <label>Paste script here</label>
    <textarea id="matchScript" placeholder="in match bypass script..."></textarea>
  </div>

  <div class="section glass">
    <button onclick="saveScripts()">Upload Both To Database</button>
    <button onclick="loadScripts()" style="background:rgba(255,255,255,0.08)">Load Current</button>
  </div>

  <div class="section glass">
    <h2>Bulk Key Generator</h2>
    <label>Duration</label>
    <select id="bulkDuration" style="width:100%;padding:14px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);border-radius:12px;color:#fff;font-size:14px">
      <option value="900000">15 Minutes</option>
      <option value="10800000">3 Hours</option>
      <option value="21600000">6 Hours</option>
      <option value="43200000">12 Hours</option>
    </select>
    <label style="margin-top:12px">Count</label>
    <input type="number" id="bulkCount" value="10" min="1" max="100">
    <button onclick="bulkGenerate()">Generate Keys</button>
    <textarea id="bulkOutput" placeholder="generated keys appear here" readonly style="margin-top:12px"></textarea>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const FIREBASE = 'https://download-apks-adc2c-default-rtdb.firebaseio.com';
const ADMIN_PASS = 'kanha@123'; // change this

function toast(msg, ok=true){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = ok ? 'linear-gradient(135deg,#10b981,#22d3ee)' : 'linear-gradient(135deg,#ef4444,#f97316)';
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

function login(){
  const p = document.getElementById('passInput').value;
  if(p === ADMIN_PASS){
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('panel').classList.remove('hidden');
    loadScripts();
  } else {
    toast('Wrong password', false);
  }
}

async function loadScripts(){
  try {
    const r = await fetch(`${FIREBASE}/scripts.json`);
    const d = await r.json();
    if(d){
      document.getElementById('loginScript').value = d.loginBypass || '';
      document.getElementById('matchScript').value = d.matchBypass || '';
      toast('Scripts loaded');
    } else {
      toast('No scripts found yet');
    }
  } catch(e){ toast('Load failed', false); }
}

async function saveScripts(){
  const loginBypass = document.getElementById('loginScript').value.trim();
  const matchBypass = document.getElementById('matchScript').value.trim();
  if(!loginBypass && !matchBypass){ toast('Both empty', false); return; }
  try {
    await fetch(`${FIREBASE}/scripts.json`, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({loginBypass, matchBypass, updatedAt: Date.now()})
    });
    toast('Uploaded to database');
  } catch(e){ toast('Upload failed', false); }
}

function randKey(){
  const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let k = '';
  for(let i=0;i<16;i++) k += c[Math.floor(Math.random()*c.length)];
  return k;
}

async function bulkGenerate(){
  const dur = parseInt(document.getElementById('bulkDuration').value);
  const count = Math.min(100, parseInt(document.getElementById('bulkCount').value) || 1);
  const out = document.getElementById('bulkOutput');
  out.value = 'generating...\n';
  const keys = [];
  for(let i=0;i<count;i++){
    const k = randKey();
    const data = {
      time: dur,
      expiresAt: Date.now() + dur,
      createdAt: Date.now(),
      prefilled: true
    };
    try {
      await fetch(`${FIREBASE}/keys/${k}.json`, {
        method: 'PUT',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(data)
      });
      keys.push(k);
      out.value = keys.join('\n');
    } catch(e){ out.value += `\n${k} FAILED`; }
  }
  toast(`${count} keys generated`);
}
</script>
</body>
</html>
