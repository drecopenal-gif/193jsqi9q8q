<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XRYS Link Bypasser</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: #00ff41; font-family: 'Courier New', Courier, monospace; }
        .glass { background: rgba(10, 20, 10, 0.8); border: 1px solid #00ff41; box-shadow: 0 0 15px rgba(0, 255, 65, 0.2); }
        input { background: #000; border: 1px solid #333; color: #00ff41; }
        input:focus { border-color: #00ff41; outline: none; box-shadow: 0 0 10px rgba(0,255,65,0.5); }
        .btn { background: #00ff41; color: #000; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: #fff; box-shadow: 0 0 20px #00ff41; }
        .loader { border: 4px solid #111; border-top: 4px solid #00ff41; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-4">

    <div class="glass p-8 rounded-xl w-full max-w-lg relative overflow-hidden">
        
        <!-- Matrix Rain Effect Background -->
        <div class="absolute inset-0 opacity-10 pointer-events-none" id="matrix"></div>

        <div class="relative z-10 text-center mb-6">
            <h1 class="text-3xl font-bold mb-2">XRYS BYPASSER</h1>
            <p class="text-sm text-gray-400">Bypass AdLinks, ShrinkMe, Linkvertise instantly.</p>
        </div>

        <div class="relative z-10 flex flex-col gap-4">
            <input type="text" id="urlInput" placeholder="Paste shortener link here..." class="w-full p-4 rounded-lg text-sm">
            
            <button onclick="bypassLink()" id="bypassBtn" class="btn w-full p-4 rounded-lg text-lg">
                BYPASS LINK
            </button>
        </div>

        <!-- Loader -->
        <div id="loaderBox" class="hidden flex-col items-center mt-6 relative z-10">
            <div class="loader mb-2"></div>
            <p class="text-xs text-gray-400 animate-pulse">Bypassing ads and timers...</p>
        </div>

        <!-- Result -->
        <div id="resultBox" class="hidden mt-6 relative z-10 flex flex-col gap-3">
            <p class="text-sm text-green-400">Original Link Found:</p>
            <div class="p-3 bg-gray-900 border border-gray-700 rounded break-all text-sm text-gray-300" id="directLinkText"></div>
            
            <a href="#" id="openLinkBtn" target="_blank" class="btn text-center w-full p-3 rounded-lg block">
                OPEN DIRECT LINK
            </a>
        </div>

        <!-- Error -->
        <div id="errorBox" class="hidden mt-6 relative z-10 p-3 bg-red-900/50 border border-red-500 rounded text-red-400 text-sm text-center">
            Failed to bypass. Link might be invalid or API is down.
        </div>

    </div>

    <script>
        async function bypassLink() {
            const url = document.getElementById('urlInput').value.trim();
            if(!url) return alert("Enter a link first!");

            // UI Reset
            document.getElementById('resultBox').classList.add('hidden');
            document.getElementById('errorBox').classList.add('hidden');
            document.getElementById('loaderBox').classList.remove('hidden');
            document.getElementById('bypassBtn').disabled = true;

            try {
                // Using Bypass.vip public API
                const response = await fetch(`https://api.bypass.vip/bypass?url=${encodeURIComponent(url)}`);
                const data = await response.json();

                if(data.status === "success" && data.result) {
                    document.getElementById('directLinkText').innerText = data.result;
                    document.getElementById('openLinkBtn').href = data.result;
                    document.getElementById('resultBox').classList.remove('hidden');
                } else {
                    throw new Error("Bypass failed");
                }
            } catch (error) {
                console.error(error);
                document.getElementById('errorBox').classList.remove('hidden');
            } finally {
                document.getElementById('loaderBox').classList.add('hidden');
                document.getElementById('bypassBtn').disabled = false;
            }
        }

        // Enter key listener
        document.getElementById('urlInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') bypassLink();
        });

        // Simple Matrix Rain Effect
        const matrix = document.getElementById('matrix');
        for(let i=0; i<20; i++) {
            let span = document.createElement('span');
            span.innerText = "010101";
            span.style.position = 'absolute';
            span.style.left = Math.random() * 100 + '%';
            span.style.top = Math.random() * 100 + '%';
            span.style.animation = `blink ${Math.random() * 3 + 1}s infinite`;
            matrix.appendChild(span);
        }
    </script>
    <style>
        @keyframes blink { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
    </style>
</body>
</html>
