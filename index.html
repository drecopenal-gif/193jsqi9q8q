<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Locker Pro</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            dark: '#0a0a0f',
                            purple: '#a855f7',
                            cyan: '#00d4ff',
                            glass: 'rgba(255, 255, 255, 0.05)',
                            glassBorder: 'rgba(255, 255, 255, 0.1)'
                        }
                    },
                    animation: {
                        'blob': 'blob 7s infinite',
                        'pop-in': 'pop-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'shake': 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both',
                        'pulse-glow': 'pulse-glow 2s infinite',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        'pop-in': {
                            '0%': { opacity: '0', transform: 'scale(0.9) translateY(20px)' },
                            '100%': { opacity: '1', transform: 'scale(1) translateY(0)' }
                        },
                        shake: {
                            '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                            '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                            '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                            '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
                        },
                        'pulse-glow': {
                            '0%, 100%': { boxShadow: '0 0 15px rgba(0, 212, 255, 0.5)' },
                            '50%': { boxShadow: '0 0 30px rgba(168, 85, 247, 0.8)' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0a0a0f;
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Glassmorphism Styles */
        .glass-panel {
            background: rgba(15, 15, 20, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        
        .glass-input:focus {
            outline: none;
            border-color: #a855f7;
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.2);
            background: rgba(10, 10, 15, 0.8);
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .primary-btn {
            background: linear-gradient(135deg, #a855f7, #00d4ff);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            z-index: 1;
        }

        .primary-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: skewX(-25deg);
            transition: 0.5s;
            z-index: -1;
        }

        .primary-btn:hover::before {
            left: 150%;
        }

        .primary-btn:hover {
            box-shadow: 0 10px 20px -5px rgba(0, 212, 255, 0.5);
            transform: translateY(-2px);
        }

        .task-btn {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .task-btn.completed {
            background: rgba(16, 185, 129, 0.15);
            border-color: rgba(16, 185, 129, 0.5);
            pointer-events: none;
        }

        /* Glowing Orbs Background */
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: -1;
            animation: blob 10s infinite alternate;
        }
        
        .orb-1 { top: -10%; left: -10%; width: 400px; height: 400px; background: #a855f7; }
        .orb-2 { top: 40%; right: -10%; width: 300px; height: 300px; background: #00d4ff; animation-delay: 2s; }
        .orb-3 { bottom: -10%; left: 20%; width: 350px; height: 350px; background: #4f46e5; animation-delay: 4s; }
    </style>
</head>
<body class="relative flex flex-col items-center justify-center p-4">

    <!-- Background Orbs -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <!-- ==================== ADMIN PANEL ==================== -->
    <div id="admin-view" class="w-full max-w-xl hidden animate-pop-in">
        <div class="glass-panel rounded-3xl p-8">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-cyan-400">Locker Setup</h1>
                <p class="text-gray-400 text-sm mt-2">Configure tasks and generate your secure link.</p>
            </div>

            <div class="space-y-6">
                <!-- Main Link -->
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Final Destination Link <span class="text-red-400">*</span></label>
                    <div class="relative">
                        <i class="fa-solid fa-link absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="url" id="main-link" placeholder="https://example.com/file" class="w-full glass-input rounded-xl py-3 pl-11 pr-4 text-white placeholder-gray-500">
                    </div>
                </div>

                <div class="h-px w-full bg-white/10 my-4"></div>

                <!-- Dynamic Task Containers -->
                <div id="task-container" class="space-y-4">
                    <!-- Initial Tasks -->
                    <div class="task-group space-y-2">
                        <label class="block text-sm font-medium text-gray-300">Instagram Link</label>
                        <div class="relative">
                            <i class="fa-brands fa-instagram absolute left-4 top-1/2 -translate-y-1/2 text-pink-500"></i>
                            <input type="url" data-type="instagram" placeholder="https://instagram.com/..." class="task-input w-full glass-input rounded-xl py-3 pl-11 pr-4 text-white">
                        </div>
                    </div>

                    <div class="task-group space-y-2">
                        <label class="block text-sm font-medium text-gray-300">Telegram Link</label>
                        <div class="relative">
                            <i class="fa-brands fa-telegram absolute left-4 top-1/2 -translate-y-1/2 text-blue-400"></i>
                            <input type="url" data-type="telegram" placeholder="https://t.me/..." class="task-input w-full glass-input rounded-xl py-3 pl-11 pr-4 text-white">
                        </div>
                    </div>
                    
                    <div class="task-group space-y-2">
                        <label class="block text-sm font-medium text-gray-300">YouTube Link</label>
                        <div class="relative">
                            <i class="fa-brands fa-youtube absolute left-4 top-1/2 -translate-y-1/2 text-red-500"></i>
                            <input type="url" data-type="youtube" placeholder="https://youtube.com/..." class="task-input w-full glass-input rounded-xl py-3 pl-11 pr-4 text-white">
                        </div>
                    </div>
                </div>

                <!-- Add More Buttons -->
                <div class="flex gap-3">
                    <button onclick="addTaskField('instagram')" class="flex-1 glass-btn rounded-xl py-2 text-sm font-medium text-pink-400 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-plus"></i> Instagram
                    </button>
                    <button onclick="addTaskField('telegram')" class="flex-1 glass-btn rounded-xl py-2 text-sm font-medium text-blue-400 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-plus"></i> Telegram
                    </button>
                </div>

                <button onclick="generateLink()" class="w-full primary-btn rounded-xl py-4 font-bold text-white shadow-lg mt-6 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Generate Unlock Link
                </button>

                <!-- Result Box -->
                <div id="result-box" class="hidden mt-6 p-4 rounded-xl bg-black/50 border border-purple-500/30">
                    <p class="text-sm text-gray-300 mb-2">Share this link with users:</p>
                    <div class="flex gap-2">
                        <input type="text" id="generated-url" readonly class="w-full bg-transparent border-b border-gray-600 pb-1 text-cyan-300 text-sm focus:outline-none">
                        <button onclick="copyGeneratedLink()" class="bg-white/10 hover:bg-white/20 p-2 rounded-lg transition">
                            <i class="fa-regular fa-copy text-white"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <!-- ==================== USER VIEW ==================== -->
    <div id="user-view" class="w-full max-w-md hidden animate-pop-in">
        <div class="glass-panel rounded-3xl p-6 sm:p-8">
            <div class="text-center mb-8">
                <div class="w-16 h-16 mx-auto bg-gradient-to-tr from-purple-500 to-cyan-500 rounded-full flex items-center justify-center mb-4 shadow-[0_0_20px_rgba(168,85,247,0.4)]">
                    <i class="fa-solid fa-lock text-2xl text-white"></i>
                </div>
                <h2 class="text-2xl font-bold text-white mb-2">Unlock Content</h2>
                <p class="text-gray-400 text-sm">Complete the tasks below to reveal the hidden link.</p>
            </div>

            <div id="user-tasks-container" class="space-y-4 mb-8">
                <!-- Task buttons will be injected here -->
            </div>

            <!-- Final Unlock Button -->
            <button id="final-unlock-btn" disabled onclick="openMainLink()" class="w-full glass-btn rounded-xl py-4 font-bold text-gray-500 flex items-center justify-center gap-2 cursor-not-allowed opacity-50 transition-all duration-500">
                <i class="fa-solid fa-lock"></i> Get Main Link
            </button>
        </div>
    </div>


    <!-- ==================== SCRIPTS ==================== -->
    <script>
        // --- AUDIO & HAPTICS SYSTEM ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTone(freq, type, duration, vol=0.1) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        const haptics = {
            click: () => {
                if(navigator.vibrate) navigator.vibrate(20);
                playTone(600, 'sine', 0.1, 0.05);
            },
            error: () => {
                if(navigator.vibrate) navigator.vibrate([60, 40, 60]);
                playTone(150, 'sawtooth', 0.3, 0.1);
            },
            success: () => {
                if(navigator.vibrate) navigator.vibrate([40, 30, 40]);
                playTone(880, 'sine', 0.1, 0.05);
                setTimeout(() => playTone(1200, 'sine', 0.2, 0.05), 100);
            },
            unlock: () => {
                if(navigator.vibrate) navigator.vibrate([50, 50, 50, 50, 100]);
                playTone(523.25, 'triangle', 0.1, 0.1);
                setTimeout(() => playTone(659.25, 'triangle', 0.1, 0.1), 100);
                setTimeout(() => playTone(783.99, 'triangle', 0.2, 0.1), 200);
                setTimeout(() => playTone(1046.50, 'square', 0.4, 0.15), 300);
            }
        };

        // --- TOAST SYSTEM ---
        function showToast(msg, type='error') {
            const toast = document.createElement('div');
            const colors = type === 'error' 
                ? 'bg-red-500/20 border-red-500 text-red-400 shadow-[0_0_20px_rgba(239,68,68,0.3)]' 
                : 'bg-green-500/20 border-green-500 text-green-400 shadow-[0_0_20px_rgba(16,185,129,0.3)]';
            const icon = type === 'error' ? 'fa-triangle-exclamation' : 'fa-check';

            toast.className = `fixed top-6 left-1/2 -translate-x-1/2 px-6 py-3 rounded-full border backdrop-blur-xl transition-all duration-500 transform -translate-y-[150%] opacity-0 z-50 flex items-center gap-3 ${colors}`;
            toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span class="font-medium tracking-wide text-sm">${msg}</span>`;
            
            document.body.appendChild(toast);
            
            requestAnimationFrame(() => {
                toast.classList.remove('-translate-y-[150%]', 'opacity-0');
            });
            
            setTimeout(() => {
                toast.classList.add('-translate-y-[150%]', 'opacity-0');
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        // --- APP STATE ---
        const urlParams = new URLSearchParams(window.location.search);
        const dataParam = urlParams.get('data');
        
        let tasksData = [];
        let mainLinkUrl = '';
        let totalTasks = 0;
        let completedCount = 0;
        
        // Verification State
        let activeTaskIndex = null;
        let clickCounts = {};

        // --- ROUTING ---
        window.onload = () => {
            if(dataParam) {
                initUserView();
            } else {
                document.getElementById('admin-view').classList.remove('hidden');
            }
        };

        // ==================== ADMIN FUNCTIONS ====================
        function addTaskField(type) {
            haptics.click();
            const container = document.getElementById('task-container');
            const div = document.createElement('div');
            div.className = 'task-group space-y-2 animate-pop-in';
            
            let icon = type === 'instagram' ? 'fa-instagram text-pink-500' : 'fa-telegram text-blue-400';
            
            div.innerHTML = `
                <div class="flex justify-between items-center">
                    <label class="block text-sm font-medium text-gray-300">${type.charAt(0).toUpperCase() + type.slice(1)} Link</label>
                    <button onclick="this.parentElement.parentElement.remove()" class="text-red-400 text-xs hover:text-red-300"><i class="fa-solid fa-xmark"></i> Remove</button>
                </div>
                <div class="relative">
                    <i class="fa-brands ${icon} absolute left-4 top-1/2 -translate-y-1/2"></i>
                    <input type="url" data-type="${type}" placeholder="https://${type}.com/..." class="task-input w-full glass-input rounded-xl py-3 pl-11 pr-4 text-white">
                </div>
            `;
            container.appendChild(div);
        }

        function generateLink() {
            haptics.click();
            const mainLink = document.getElementById('main-link').value.trim();
            if(!mainLink) return showToast("Main Destination Link is required!", "error");

            const inputs = document.querySelectorAll('.task-input');
            const tasks = [];
            
            inputs.forEach(input => {
                const url = input.value.trim();
                if(url) {
                    tasks.push({
                        type: input.dataset.type,
                        url: url
                    });
                }
            });

            if(tasks.length === 0) return showToast("Add at least one task link!", "error");

            const payload = { main: mainLink, tasks: tasks };
            
            try {
                // Encode to Base64
                const encodedData = btoa(JSON.stringify(payload));
                const finalUrl = window.location.origin + window.location.pathname + '?data=' + encodedData;
                
                const resultBox = document.getElementById('result-box');
                const urlInput = document.getElementById('generated-url');
                
                urlInput.value = finalUrl;
                resultBox.classList.remove('hidden');
                resultBox.classList.add('animate-pop-in');
                showToast("Link Generated Successfully!", "success");
            } catch(e) {
                showToast("Error generating link. Avoid special characters.", "error");
            }
        }

        function copyGeneratedLink() {
            haptics.click();
            const input = document.getElementById('generated-url');
            input.select();
            document.execCommand('copy');
            showToast("Link Copied to Clipboard!", "success");
        }


        // ==================== USER VIEW FUNCTIONS ====================
        function initUserView() {
            try {
                const decoded = JSON.parse(atob(dataParam));
                tasksData = decoded.tasks;
                mainLinkUrl = decoded.main;
                totalTasks = tasksData.length;

                if(!tasksData || !mainLinkUrl) throw new Error("Invalid format");

                renderTasks();
                document.getElementById('user-view').classList.remove('hidden');
            } catch(e) {
                document.body.innerHTML = `<div class="flex items-center justify-center h-screen"><p class="text-red-500 font-bold text-xl">Invalid or Corrupted Link.</p></div>`;
            }
        }

        function renderTasks() {
            const container = document.getElementById('user-tasks-container');
            container.innerHTML = '';

            tasksData.forEach((task, index) => {
                let iconClass, bgClass, name;
                if(task.type === 'instagram') { iconClass = 'fa-instagram'; bgClass = 'bg-pink-500/20 text-pink-400'; name = 'Instagram'; }
                else if(task.type === 'telegram') { iconClass = 'fa-telegram'; bgClass = 'bg-blue-500/20 text-blue-400'; name = 'Telegram'; }
                else { iconClass = 'fa-youtube'; bgClass = 'bg-red-500/20 text-red-400'; name = 'YouTube'; }

                const btn = document.createElement('button');
                btn.id = `task-btn-${index}`;
                btn.className = `task-btn w-full glass-btn rounded-xl p-4 flex items-center justify-between border border-white/10 relative overflow-hidden group`;
                btn.onclick = () => handleTaskClick(index, task.url);
                
                btn.innerHTML = `
                    <div class="flex items-center gap-4 z-10">
                        <div class="w-10 h-10 rounded-full flex items-center justify-center ${bgClass}">
                            <i class="fa-brands ${iconClass} text-xl"></i>
                        </div>
                        <div class="text-left">
                            <h3 class="font-semibold text-white">Subscribe ${name}</h3>
                            <p class="status-text text-xs text-gray-400 mt-0.5">Click to complete task</p>
                        </div>
                    </div>
                    <div class="status-icon w-8 h-8 rounded-full bg-white/5 flex items-center justify-center border border-white/10 z-10 transition-all">
                        <i class="fa-solid fa-chevron-right text-gray-400 text-sm"></i>
                    </div>
                `;
                container.appendChild(btn);
            });
        }

        // --- VERIFICATION LOGIC ---
        function handleTaskClick(index, url) {
            const btn = document.getElementById(`task-btn-${index}`);
            if(btn.classList.contains('completed')) return;

            haptics.click();
            
            // Record click
            clickCounts[index] = (clickCounts[index] || 0) + 1;
            activeTaskIndex = index;

            // Open target URL
            window.open(url, '_blank');
        }

        // Detect Return to Window
        window.addEventListener('focus', () => {
            if (activeTaskIndex !== null) {
                const index = activeTaskIndex;
                activeTaskIndex = null; // Clear to prevent double triggering

                const btn = document.getElementById(`task-btn-${index}`);
                if (!btn || btn.classList.contains('completed')) return;

                const clicks = clickCounts[index];
                
                // LOGIC: 
                // Human counting: 1st task (idx 0), 3rd task (idx 2) require 2 clicks.
                // 2nd task (idx 1), 4th task (idx 3) require 1 click.
                const isOddHumanTask = (index % 2 === 0); // Index 0, 2, 4...

                if (isOddHumanTask && clicks === 1) {
                    // First click on 1st/3rd task -> Show Error
                    haptics.error();
                    showToast("Please complete your task and next!", "error");
                    btn.classList.add('border-red-500/50', 'bg-red-500/5', 'animate-shake');
                    setTimeout(() => {
                        btn.classList.remove('border-red-500/50', 'bg-red-500/5', 'animate-shake');
                    }, 500);
                } else {
                    // 2nd click on 1st/3rd task OR 1st click on 2nd/4th task -> Start hidden timer
                    startVerificationProcess(index, btn);
                }
            }
        });

        function startVerificationProcess(index, btn) {
            // UI Update: Show verifying, hide timer completely
            btn.querySelector('.status-text').innerText = "Verifying...";
            btn.querySelector('.status-text').classList.add('text-cyan-400');
            const statusIcon = btn.querySelector('.status-icon');
            statusIcon.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin text-cyan-400"></i>';
            statusIcon.classList.add('border-cyan-500/50');

            // 6-Second Hidden Timer
            setTimeout(() => {
                if (btn.classList.contains('completed')) return;

                // Mark Completed
                btn.classList.add('completed');
                btn.querySelector('.status-text').innerText = "Completed";
                btn.querySelector('.status-text').classList.replace('text-cyan-400', 'text-green-400');
                
                statusIcon.innerHTML = '<i class="fa-solid fa-check text-white"></i>';
                statusIcon.className = 'status-icon w-8 h-8 rounded-full bg-green-500 flex items-center justify-center shadow-[0_0_15px_rgba(16,185,129,0.5)] z-10 transition-all';
                
                haptics.success();
                completedCount++;
                
                checkAllTasksCompleted();
            }, 6000);
        }

        function checkAllTasksCompleted() {
            if (completedCount >= totalTasks) {
                setTimeout(() => {
                    haptics.unlock();
                    
                    const unlockBtn = document.getElementById('final-unlock-btn');
                    const icon = document.querySelector('.fa-lock.text-2xl');
                    
                    // Update Header Icon
                    icon.classList.replace('fa-lock', 'fa-lock-open');
                    
                    // Unlock Main Button with effects
                    unlockBtn.disabled = false;
                    unlockBtn.className = "w-full primary-btn animate-pulse-glow rounded-xl py-4 font-bold text-white flex items-center justify-center gap-2 transition-all duration-500 transform hover:scale-105 shadow-[0_0_30px_rgba(0,212,255,0.6)]";
                    unlockBtn.innerHTML = `<i class="fa-solid fa-unlock"></i> Get Main Link`;
                    
                    showToast("All Tasks Completed! Link Unlocked.", "success");
                }, 500); // Slight delay for dramatic effect
            }
        }

        function openMainLink() {
            haptics.click();
            window.location.href = mainLinkUrl;
        }
    </script>
</body>
</html>
