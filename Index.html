<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0014">
<title>Premium Bypass</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(ellipse at top,#1a0a2e,#0a0014 60%);color:#fff;position:relative}

/* Animated background orbs */
body::before,body::after{content:'';position:fixed;border-radius:50%;filter:blur(80px);opacity:0.4;z-index:0;pointer-events:none}
body::before{width:300px;height:300px;background:#7c3aed;top:-100px;left:-100px;animation:float1 8s ease-in-out infinite}
body::after{width:250px;height:250px;background:#22d3ee;bottom:-80px;right:-80px;animation:float2 10s ease-in-out infinite}
@keyframes float1{50%{transform:translate(50px,30px)}}
@keyframes float2{50%{transform:translate(-40px,-20px)}}

.page{position:absolute;inset:0;padding:24px 20px;display:flex;flex-direction:column;opacity:0;transform:translateX(30px);pointer-events:none;transition:opacity 0.4s,transform 0.4s;z-index:1;overflow-y:auto}
.page.active{opacity:1;transform:translateX(0);pointer-events:auto}

.glass{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:20px;padding:20px;box-shadow:0 8px 32px rgba(0,0,0,0.3)}

.brand{text-align:center;margin-bottom:32px;margin-top:20px}
.brand h1{font-size:32px;font-weight:800;background:linear-gradient(135deg,#a78bfa,#22d3ee,#a78bfa);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shine 3s linear infinite;letter-spacing:-0.5px}
.brand p{font-size:12px;color:#94a3b8;margin-top:6px;letter-spacing:2px;text-transform:uppercase}
@keyframes shine{to{background-position:200% center}}

label{display:block;font-size:11px;color:#a78bfa;margin-bottom:10px;text-transform:uppercase;letter-spacing:2px;font-weight:600}
input,textarea{width:100%;padding:16px;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.1);border-radius:14px;color:#fff;font-size:15px;font-family:inherit;transition:all 0.3s}
input:focus,textarea:focus{outline:none;border-color:#a78bfa;box-shadow:0 0 0 4px rgba(167,139,250,0.15)}
input::placeholder,textarea::placeholder{color:#475569}
textarea{min-height:100px;resize:none;font-family:'Courier New',monospace;font-size:13px}

.btn{width:100%;padding:16px;border:none;border-radius:14px;color:#fff;font-weight:700;font-size:16px;cursor:pointer;transition:all 0.2s;background:linear-gradient(135deg,#7c3aed,#a78bfa);box-shadow:0 4px 20px rgba(124,58,237,0.4);letter-spacing:0.5px;position:relative;overflow:hidden}
.btn:active{transform:scale(0.97)}
.btn::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);transition:left 0.5s}
.btn:active::before{left:100%}
.btn.secondary{background:rgba(255,255,255,0.08);box-shadow:none;border:1px solid rgba(255,255,255,0.15)}
.btn.success{background:linear-gradient(135deg,#10b981,#22d3ee);box-shadow:0 4px 20px rgba(16,185,129,0.4)}
.btn.danger{background:linear-gradient(135deg,#ef4444,#f97316);box-shadow:0 4px 20px rgba(239,68,68,0.4)}
.btn:disabled{opacity:0.5;pointer-events:none}

.spacer{flex:1}
.gap{height:12px}

/* Duration cards */
.dur-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dur-card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:24px 16px;text-align:center;cursor:pointer;transition:all 0.25s;position:relative;overflow:hidden}
.dur-card:active{transform:scale(0.95)}
.dur-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(167,139,250,0.15),rgba(34,211,238,0.15));opacity:0;transition:opacity 0.3s}
.dur-card:active::before{opacity:1}
.dur-time{font-size:26px;font-weight:800;background:linear-gradient(135deg,#a78bfa,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.dur-label{font-size:12px;color:#94a3b8;margin-top:4px;text-transform:uppercase;letter-spacing:1.5px}

/* Bypass toggles */
.bypass-btn{padding:20px;border-radius:16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);text-align:center;font-weight:700;font-size:16px;cursor:pointer;transition:all 0.3s;position:relative;overflow:hidden}
.bypass-btn:active{transform:scale(0.97)}
.bypass-btn.armed{background:linear-gradient(135deg,rgba(16,185,129,0.3),rgba(34,211,238,0.3));border-color:#10b981;box-shadow:0 0 30px rgba(16,185,129,0.4)}
.bypass-btn.armed::after{content:'✓';position:absolute;right:16px;top:50%;transform:translateY(-50%);color:#10b981;font-size:22px}

/* App grid */
.app-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.app-tile{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:16px 12px;text-align:center;cursor:pointer;transition:all 0.25s;position:relative}
.app-tile:active{transform:scale(0.96)}
.app-tile.selected{background:linear-gradient(135deg,rgba(124,58,237,0.3),rgba(34,211,238,0.3));border-color:#a78bfa;box-shadow:0 0 24px rgba(167,139,250,0.4)}
.app-tile.selected::after{content:'✓';position:absolute;top:8px;right:10px;color:#10b981;font-size:16px;font-weight:900}
.app-icon{width:52px;height:52px;margin:0 auto 10px;border-radius:14px;background:linear-gradient(135deg,#7c3aed,#22d3ee);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;box-shadow:0 4px 16px rgba(124,58,237,0.4)}
.app-name{font-size:12px;font-weight:600;color:#e2e8f0;line-height:1.3}

/* Status pill */
.status{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:100px;background:rgba(16,185,129,0.15);border:1px solid rgba(16,185,129,0.3);font-size:11px;color:#10b981;font-weight:600;text-transform:uppercase;letter-spacing:1px}
.status.warn{background:rgba(251,191,36,0.15);border-color:rgba(251,191,36,0.3);color:#fbbf24}
.status::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.5s infinite}
@keyframes pulse{50%{opacity:0.4;transform:scale(0.8)}}

/* Timer display */
.timer-display{text-align:center;padding:32px 20px}
.timer-value{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,#a78bfa,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-2px;line-height:1}
.timer-label{font-size:12px;color:#94a3b8;text-transform:uppercase;letter-spacing:3px;margin-top:10px}

/* Expiry overlay */
#expiryOverlay{position:fixed;inset:0;background:linear-gradient(135deg,#1a0033,#0a0014);z-index:99999;display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;animation:fadeIn 0.4s}
#expiryOverlay.show{display:flex}
@keyframes fadeIn{from{opacity:0}}
.expiry-icon{font-size:80px;margin-bottom:20px;animation:shake 1s infinite}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.expiry-title{font-size:28px;font-weight:800;background:linear-gradient(135deg,#ef4444,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px}
.expiry-msg{color:#94a3b8;font-size:14px;margin-bottom:30px;line-height:1.6;max-width:320px}

/* Loading */
.loader{width:20px;height:20px;border:2px solid rgba(255,255,255,0.2);border-top-color:#a78bfa;border-radius:50%;animation:spin 0.8s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:linear-gradient(135deg,#10b981,#22d3ee);padding:14px 24px;border-radius:14px;font-weight:600;font-size:14px;transition:transform 0.35s cubic-bezier(0.4,0,0.2,1);z-index:100000;max-width:90%;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.4)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.error{background:linear-gradient(135deg,#ef4444,#f97316)}

/* Success check animation */
.success-check{width:80px;height:80px;margin:0 auto 20px;border-radius:50%;background:linear-gradient(135deg,#10b981,#22d3ee);display:flex;align-items:center;justify-content:center;animation:pop 0.5s cubic-bezier(0.34,1.56,0.64,1)}
.success-check::after{content:'✓';font-size:44px;color:#fff;font-weight:900}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}

.scroll-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px}
.scroll-area::-webkit-scrollbar{width:0}
</style>
</head>
<body>

<!-- PAGE 1: KEY VERIFY -->
<div class="page active" id="page1">
  <div class="brand">
    <h1>PREMIUM BYPASS</h1>
    <p>Secure Access</p>
  </div>

  <div class="glass" style="margin-bottom:16px">
    <label>Access Key</label>
    <input type="text" id="keyInput" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters">
    <div class="gap"></div>
    <button class="btn" id="verifyBtn">Verify Key</button>
  </div>

  <button class="btn secondary" onclick="showPage(2)">Get Free Keys →</button>
</div>

<!-- PAGE 2: DURATION PICKER -->
<div class="page" id="page2">
  <div class="brand">
    <h1>Free Keys</h1>
    <p>Select Duration</p>
  </div>

  <div class="dur-grid">
    <div class="dur-card" onclick="generateKey(900000,'15 Minutes')">
      <div class="dur-time">15</div>
      <div class="dur-label">Minutes</div>
    </div>
    <div class="dur-card" onclick="generateKey(10800000,'3 Hours')">
      <div class="dur-time">3</div>
      <div class="dur-label">Hours</div>
    </div>
    <div class="dur-card" onclick="generateKey(21600000,'6 Hours')">
      <div class="dur-time">6</div>
      <div class="dur-label">Hours</div>
    </div>
    <div class="dur-card" onclick="generateKey(43200000,'12 Hours')">
      <div class="dur-time">12</div>
      <div class="dur-label">Hours</div>
    </div>
  </div>

  <div class="spacer"></div>
  <button class="btn secondary" onclick="showPage(1)">← Back</button>
</div>

<!-- PAGE 3: BYPASS -->
<div class="page" id="page3">
  <div class="brand">
    <h1>Bypass Control</h1>
    <p>Activation Panel</p>
  </div>

  <div class="bypass-btn" id="loginBypassBtn" onclick="armBypass('login')">Login Bypass</div>
  <div class="gap"></div>
  <div class="bypass-btn" id="matchBypassBtn" onclick="armBypass('match')">In Match Bypass</div>

  <div class="gap"></div>

  <div class="glass">
    <label>Bypass Script</label>
    <textarea id="scriptInput" placeholder="paste script here..."></textarea>
    <div class="gap"></div>
    <button class="btn success" id="injectBtn" onclick="injectScript()">Bypassing Injection</button>
  </div>
</div>

<!-- PAGE 4: APPS -->
<div class="page" id="page4">
  <div class="brand">
    <h1>Select App</h1>
    <p>Root & Lock</p>
  </div>

  <div class="glass" style="margin-bottom:16px">
    <div class="status" id="statusPill">READY</div>
  </div>

  <div class="scroll-area">
    <div class="app-grid" id="appGrid"></div>
  </div>

  <div class="gap"></div>
  <button class="btn danger" id="startBtn" onclick="startRooting()" disabled>Start Rooting</button>

  <div id="timerBox" style="display:none;margin-top:16px">
    <div class="glass timer-display">
      <div class="timer-value" id="timerValue">--:--</div>
      <div class="timer-label">Time Remaining</div>
    </div>
  </div>
</div>

<!-- EXPIRY OVERLAY -->
<div id="expiryOverlay">
  <div class="expiry-icon">⚠️</div>
  <div class="expiry-title">KEY EXPIRED</div>
  <div class="expiry-msg">Your key was expired.<br>Generate a new key to continue.</div>
  <button class="btn danger" onclick="resetToKeys()">Generate New Key</button>
</div>

<div class="toast" id="toast"></div>

<script>
const FIREBASE = 'https://download-apks-adc2c-default-rtdb.firebaseio.com';

// ============ STATE ============
let state = {
  authKey: localStorage.getItem('authKey'),
  expiry: parseInt(localStorage.getItem('authExpiry')) || 0,
  duration: parseInt(localStorage.getItem('authTime')) || 0,
  loginArmed: false,
  matchArmed: false,
  selectedApps: [],
  timerInterval: null
};

const APP_LIST = [
  {pkg:'com.dts.freefiremax', name:'Free Fire Max', icon:'FF', color:'#ef4444'},
  {pkg:'com.dts.freefire', name:'Free Fire', icon:'FF', color:'#f97316'},
  {pkg:'com.pubg.imobile', name:'BGMI', icon:'BG', color:'#f59e0b'},
  {pkg:'com.tencent.ig', name:'PUBG Mobile', icon:'PM', color:'#eab308'},
  {pkg:'com.activision.callofduty.shooter', name:'COD Mobile', icon:'CO', color:'#84cc16'},
  {pkg:'com.mojang.minecraftpe', name:'Minecraft', icon:'MC', color:'#22c55e'},
  {pkg:'com.axlebolt.standoff2', name:'Standoff 2', icon:'S2', color:'#06b6d4'},
  {pkg:'com.supercell.clashofclans', name:'Clash of Clans', icon:'CC', color:'#3b82f6'}
];

// ============ SOUND ============
let audioCtx;
function initAudio(){
  if(!audioCtx){
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  }
}
function playTone(freq, dur, type='sine', gain=0.15){
  initAudio();
  if(!audioCtx) return;
  try {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(gain, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.start();
    o.stop(audioCtx.currentTime + dur);
  } catch(e){}
}
function playClick(){ playTone(880, 0.08, 'sine', 0.12); }
function playSuccess(){
  playTone(523.25, 0.15, 'sine', 0.18);
  setTimeout(()=>playTone(659.25, 0.15, 'sine', 0.18), 100);
  setTimeout(()=>playTone(783.99, 0.15, 'sine', 0.18), 200);
  setTimeout(()=>playTone(1046.5, 0.4, 'sine', 0.2), 300);
}
function playError(){
  playTone(200, 0.15, 'sawtooth', 0.15);
  setTimeout(()=>playTone(150, 0.25, 'sawtooth', 0.15), 100);
}

// ============ TOAST ============
function toast(msg, ok=true){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (ok?'':' error');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2500);
}

// ============ PAGE NAV ============
function showPage(n){
  playClick();
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page'+n).classList.add('active');
}

// ============ KEY VERIFY ============
document.getElementById('verifyBtn').onclick = async () => {
  const key = document.getElementById('keyInput').value.trim().toUpperCase();
  if(!key){ toast('Enter a key', false); playError(); return; }

  const btn = document.getElementById('verifyBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="loader"></span>Verifying...';

  try {
    const r = await fetch(`${FIREBASE}/keys/${key}.json`);
    const d = await r.json();

    if(!d){
      toast('Invalid key', false); playError();
      btn.disabled = false; btn.textContent = 'Verify Key';
      return;
    }
    if(d.expiresAt && d.expiresAt < Date.now()){
      toast('Key expired', false); playError();
      btn.disabled = false; btn.textContent = 'Verify Key';
      return;
    }

    state.authKey = key;
    state.expiry = d.expiresAt;
    state.duration = d.time;
    localStorage.setItem('authKey', key);
    localStorage.setItem('authExpiry', d.expiresAt);
    localStorage.setItem('authTime', d.time);

    playSuccess();
    toast('Key verified');
    btn.disabled = false;
    btn.textContent = 'Verify Key';
    setTimeout(()=>showPage(3), 500);
  } catch(e){
    toast('Network error', false); playError();
    btn.disabled = false; btn.textContent = 'Verify Key';
  }
};

// ============ KEY GENERATION ============
function randKey(){
  const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let k = '';
  for(let i=0;i<16;i++) k += c[Math.floor(Math.random()*c.length)];
  return k;
}

async function generateKey(durMs, label){
  playClick();
  // rate limit
  const last = parseInt(localStorage.getItem('lastKeyGen')) || 0;
  if(Date.now() - last < 60000){
    toast('Wait 60s before next key', false);
    playError();
    return;
  }

  const key = randKey();
  const payload = {
    time: durMs,
    expiresAt: Date.now() + durMs,
    createdAt: Date.now(),
    used: false
  };

  try {
    const r = await fetch(`${FIREBASE}/keys/${key}.json`, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    if(!r.ok) throw new Error('fail');

    localStorage.setItem('lastKeyGen', Date.now());
    playSuccess();
    showKeyModal(key, label);
  } catch(e){
    toast('Failed to generate', false);
    playError();
  }
}

function showKeyModal(key, label){
  const modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px';
  modal.innerHTML = `
    <div class="glass" style="max-width:360px;width:100%;text-align:center;padding:30px">
      <div class="success-check"></div>
      <div style="font-size:18px;font-weight:700;margin-bottom:8px">Key Generated</div>
      <div style="font-size:12px;color:#94a3b8;margin-bottom:20px">Valid for ${label}</div>
      <div style="background:rgba(0,0,0,0.4);border:1px dashed #a78bfa;border-radius:12px;padding:16px;font-family:'Courier New',monospace;font-size:16px;font-weight:700;letter-spacing:2px;margin-bottom:16px;word-break:break-all">${key}</div>
      <button class="btn" onclick="copyKey('${key}')">Copy Key</button>
      <div class="gap"></div>
      <button class="btn secondary" onclick="this.closest('div[style]').remove()">Close</button>
    </div>
  `;
  document.body.appendChild(modal);
}

function copyKey(k){
  playClick();
  try {
    if(navigator.clipboard) navigator.clipboard.writeText(k);
    else {
      const t = document.createElement('textarea');
      t.value = k; document.body.appendChild(t);
      t.select(); document.execCommand('copy');
      t.remove();
    }
    toast('Key copied');
  } catch(e){ toast('Copy failed', false); }
}

// ============ BYPASS ARM ============
function armBypass(type){
  playSuccess();
  if(type === 'login'){
    state.loginArmed = true;
    document.getElementById('loginBypassBtn').classList.add('armed');
  } else {
    state.matchArmed = true;
    document.getElementById('matchBypassBtn').classList.add('armed');
  }
}

// ============ SCRIPT INJECTION ============
async function injectScript(){
  const btn = document.getElementById('injectBtn');
  const pasted = document.getElementById('scriptInput').value.trim();

  if(!state.loginArmed && !state.matchArmed){
    toast('Arm both bypasses first', false);
    playError();
    return;
  }
  if(!pasted){
    toast('Paste script first', false);
    playError();
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="loader"></span>Verifying...';

  try {
    const r = await fetch(`${FIREBASE}/scripts.json`);
    const scripts = await r.json();

    const norm = s => (s||'').replace(/\s+/g,'').toLowerCase();
    const pastedNorm = norm(pasted);
    const matchLogin = norm(scripts?.loginBypass) === pastedNorm;
    const matchMatch = norm(scripts?.matchBypass) === pastedNorm;

    if(!scripts || (!matchLogin && !matchMatch)){
      toast('Invalid script', false);
      playError();
      btn.disabled = false;
      btn.textContent = 'Bypassing Injection';
      return;
    }

    playSuccess();
    toast('Script verified');
    btn.disabled = false;
    btn.textContent = 'Bypassing Injection';

     // build app grid, then navigate
    buildAppGrid();
    setTimeout(()=>showPage(4), 600);
  } catch(e){
    toast('Verify failed', false);
    playError();
    btn.disabled = false;
    btn.textContent = 'Bypassing Injection';
  }
}

// ============ APP GRID ============
function getInstalledApps(){
  try {
    if(window.Android && window.Android.getInstalledApps){
      const raw = window.Android.getInstalledApps();
      const arr = typeof raw === 'string' ? JSON.parse(raw) : raw;
      if(Array.isArray(arr) && arr.length) return arr;
    }
  } catch(e){}
  return APP_LIST;
}

function buildAppGrid(){
  const grid = document.getElementById('appGrid');
  grid.innerHTML = '';
  state.selectedApps = [];

  const apps = getInstalledApps();
  apps.forEach(app => {
    const pkg = app.pkg || app.package || app.packageName;
    const name = app.name || app.label || pkg;
    const icon = app.icon || name.substring(0,2).toUpperCase();
    if(!pkg) return;

    const tile = document.createElement('div');
    tile.className = 'app-tile';
    tile.dataset.pkg = pkg;
    tile.innerHTML = `
      <div class="app-icon">${icon}</div>
      <div class="app-name">${name}</div>
    `;
    tile.onclick = () => {
      playClick();
      tile.classList.toggle('selected');
      if(tile.classList.contains('selected')){
        state.selectedApps.push(pkg);
      } else {
        state.selectedApps = state.selectedApps.filter(p => p !== pkg);
      }
      document.getElementById('startBtn').disabled = state.selectedApps.length === 0;
    };
    grid.appendChild(tile);
  });
}
 // ============ START ROOTING ============
function startRooting(){
  if(state.selectedApps.length === 0){
    toast('Select an app first', false);
    return;
  }
  playSuccess();
  toast('Rooting active');

  // launch first selected app
  launchApp(state.selectedApps[0]);

  document.getElementById('startBtn').disabled = true;
  document.getElementById('statusPill').className = 'status';
  document.getElementById('statusPill').textContent = 'ACTIVE';

  // show timer
  document.getElementById('timerBox').style.display = 'block';
  startTimer();
}

function launchApp(pkg){
  try {
    if(window.Android && window.Android.launchApp){
      window.Android.launchApp(pkg);
      return;
    }
  } catch(e){}
  try {
    window.location.href = `intent://#Intent;package=${pkg};end`;
  } catch(e){}
}
  // ============ TIMER ============
function startTimer(){
  clearInterval(state.timerInterval);
  const update = () => {
    const left = state.expiry - Date.now();
    if(left <= 0){
      clearInterval(state.timerInterval);
      triggerExpiry();
      return;
    }
    const h = Math.floor(left / 3600000);
    const m = Math.floor((left % 3600000) / 60000);
    const s = Math.floor((left % 60000) / 1000);
    const disp = h > 0
      ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
      : `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    const el = document.getElementById('timerValue');
    if(el) el.textContent = disp;
  };
  update();
  state.timerInterval = setInterval(update, 1000);
}
  // ============ EXPIRY ============
function triggerExpiry(){
  playError();
  document.getElementById('expiryOverlay').classList.add('show');

  // attempt to close game
  state.selectedApps.forEach(pkg => {
    try {
      if(window.Android && window.Android.forceStop){
        window.Android.forceStop(pkg);
      }
    } catch(e){}
  });

  // bring user back to our app / home
  setTimeout(()=>{
    try {
      window.location.href = 'intent://#Intent;action=android.intent.action.MAIN;category=android.intent.category.HOME;end';
    } catch(e){}
  }, 800);
}

// Check expiry on app resume
document.addEventListener('visibilitychange', () => {
  if(!document.hidden && state.expiry){
    if(Date.now() >= state.expiry){
      triggerExpiry();
    }
  }
});
  // ============ RESET ============
function resetToKeys(){
  playClick();
  localStorage.removeItem('authKey');
  localStorage.removeItem('authExpiry');
  localStorage.removeItem('authTime');
  document.getElementById('expiryOverlay').classList.remove('show');
  document.getElementById('timerBox').style.display = 'none';
  document.getElementById('keyInput').value = '';
  document.getElementById('scriptInput').value = '';
  document.getElementById('loginBypassBtn').classList.remove('armed');
  document.getElementById('matchBypassBtn').classList.remove('armed');
  state = {
    authKey: null, expiry: 0, duration: 0,
    loginArmed: false, matchArmed: false,
    selectedApps: [], timerInterval: null
  };
  showPage(1);
}
  // ============ INIT ============
window.addEventListener('load', () => {
  // if already authed and not expired, skip to page 3
  if(state.authKey && state.expiry > Date.now()){
    showPage(3);
  }
});
</script>
